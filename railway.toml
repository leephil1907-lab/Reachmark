# Reachmark on Railway.
# Volume cannot be created from this file — in the dashboard:
#   Reachmark service → Volumes → Add volume → mount path /data
# DATABASE_PATH must stay /data/reachmark.sqlite3
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

[env]
DATABASE_PATH = "/data/reachmark.sqlite3"
