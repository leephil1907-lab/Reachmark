app = "reachmark"
primary_region = "lhr"  # London closest to Lagos — use 'ams' or 'cdg' if you prefer. Run `fly regions list`

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_PATH = "/data/reachmark.sqlite3"
  BACKUP_DIR = "/data/backups"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "reachmark_data"
  destination = "/data"

[checks.healthz]
  port = 8000
  type = "http"
  interval = "30s"
  timeout = "5s"
  path = "/healthz"
