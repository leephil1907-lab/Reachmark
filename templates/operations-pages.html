<section id="page-contracts" class="page"><div class="heading-row page-heading"><div><div class="eyebrow">{{ t('ws.ct_k') }}</div><h1>{{ t('ws.ct_h') }}</h1><p>{{ t('ws.ct_p') }}</p></div><button class="primary" onclick="newContract()">{{ t('ws.ct_new') }}</button></div><div class="ops-notice">{{ t('ws.ct_note') }}</div><div class="inbox-toolbar"><input id="contract-search" placeholder="{{ t('ws.ct_search') }}" oninput="renderContracts()"><select id="contract-filter" onchange="renderContracts()"><option value="">{{ t('ws.ct_all') }}</option><option>Draft</option><option>Sent</option><option>Signed</option><option>In progress</option><option>Completed</option><option>Cancelled</option></select></div><div id="contract-list" class="card"></div></section>
<div class="modal-backdrop" id="contract-modal"><div class="modal contract-modal" role="dialog" aria-modal="true" aria-labelledby="contract-modal-title"><button class="close" onclick="closeModal('contract-modal')" aria-label="{{ t('ws.ct_close') }}">×</button><div class="eyebrow">{{ t('ws.ct_mk') }}</div><h2 id="contract-modal-title">{{ t('ws.ct_mh') }}</h2><form id="contract-form"><input type="hidden" name="id"><label>{{ t('ws.ct_title') }}<input name="title" required maxlength="180" placeholder="{{ t('ws.ct_title_ph') }}"></label><div class="form-grid"><label>{{ t('ws.ct_client') }}<input name="client" required maxlength="180"></label><label>{{ t('ws.ct_email') }}<input name="email" type="email"></label></div><label>{{ t('ws.ct_lead') }} <span class="muted">{{ t('ws.ct_opt') }}</span><select name="lead_id" id="contract-lead"><option value="">{{ t('ws.ct_nolead') }}</option></select></label><div class="form-grid"><label>{{ t('ws.ct_cur') }}<select name="currency" id="contract-currency"></select></label><label>{{ t('ws.ct_val') }}<input name="amount" inputmode="decimal" placeholder="{{ t('ws.ct_val_ph') }}"></label></div><div class="form-grid"><label>{{ t('ws.ct_paid') }}<input name="paid" inputmode="decimal" value="0"></label><label>{{ t('ws.ct_stage') }}<select name="status"><option>Draft</option><option>Sent</option><option>Signed</option><option>In progress</option><option>Completed</option><option>Cancelled</option></select></label></div><label>{{ t('ws.ct_scope') }}<textarea name="notes" rows="4" maxlength="5000" placeholder="{{ t('ws.ct_scope_ph') }}"></textarea></label><p class="small muted">{{ t('ws.ct_p2') }}</p><button class="primary" type="submit">{{ t('ws.ct_save') }}</button></form></div></div>
</div>
