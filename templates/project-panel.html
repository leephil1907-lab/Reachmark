<section class="page" id="page-projects"><div class="heading-row page-heading"><div><div class="eyebrow">{{ t('ws.op_k') }}</div><h1>{{ t('ws.op_h') }}</h1><p>{{ t('ws.op_p') }}</p></div><button class="primary" onclick="editProject()">{{ t('ws.op_new') }}</button></div><div class="notice" id="project-reminders" role="status">{{ t('ws.op_loading') }}</div><div class="card"><div class="table-toolbar"><label>{{ t('ws.op_find') }}<input id="project-search" placeholder="{{ t('ws.op_find_ph') }}" oninput="renderProjects()"></label><label>{{ t('ws.op_fu') }}<select id="project-followup" onchange="renderProjects()"><option value="">{{ t('ws.op_all') }}</option><option value="overdue">{{ t('ws.op_over') }}</option><option value="today">{{ t('ws.op_today') }}</option><option value="unscheduled">{{ t('ws.op_nodate') }}</option></select></label><button class="secondary" onclick="loadProjects()">{{ t('ws.op_ref') }}</button></div><div id="project-board" class="project-board"></div><p class="small muted">{{ t('ws.op_note') }}</p></div></section>
<div class="modal-backdrop" id="project-modal"><div class="modal contract-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title"><button class="close" onclick="closeModal('project-modal')" aria-label="{{ t('ws.op_close') }}">×</button><div class="eyebrow">{{ t('ws.op_mk') }}</div><h2 id="project-modal-title">{{ t('ws.op_mh') }}</h2><form id="project-form"><input name="id" type="hidden"><label>{{ t('ws.op_title') }}<input name="title" maxlength="180" required></label><div class="form-grid"><label>{{ t('ws.op_biz') }}<select name="lead_id"></select></label><label>{{ t('ws.op_contract') }}<select name="contract_id"></select></label></div><label>{{ t('ws.op_assign') }}<input name="client_email" type="email" maxlength="250" placeholder="{{ t('ws.op_assign_ph') }}"></label><label>{{ t('ws.op_stage') }}<select name="stage"></select></label><label>{{ t('ws.op_scope') }}<textarea name="scope" maxlength="10000" rows="5" placeholder="{{ t('ws.op_scope_ph') }}"></textarea></label><div class="form-grid"><label>{{ t('ws.op_cur') }}<select name="currency"></select></label><label>{{ t('ws.op_quote') }}<input name="quote" inputmode="decimal" placeholder="{{ t('ws.op_quote_ph') }}"></label></div><label>{{ t('ws.op_next') }}<input name="next_action" maxlength="500" placeholder="{{ t('ws.op_next_ph') }}"></label><label>{{ t('ws.op_due') }}<input name="due_date" type="date"></label><div class="button-group"><button class="primary" type="submit">{{ t('ws.op_save') }}</button><button class="secondary" type="button" onclick="closeModal('project-modal')">{{ t('ws.op_cancel') }}</button></div></form><div id="project-documents" class="document-links"></div></div></div>
