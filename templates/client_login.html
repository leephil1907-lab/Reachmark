<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client sign in · Reachmark</title><link rel="stylesheet" href="/static/fonts.css"><link rel="stylesheet" href="/static/production.css"><style>.auth-page{margin:0;background:#e9edde;color:#26351e;min-height:100vh;display:grid;place-items:center;font-family:Manrope,Arial,sans-serif}.auth-card{box-sizing:border-box;width:min(460px,calc(100% - 32px));padding:40px;background:#fff;border:1px solid #d2d8c7;border-radius:22px;box-shadow:0 22px 70px #24311b10}.auth-brand{font-size:25px;font-weight:800;color:#26351e;text-decoration:none}.auth-card h1{font-size:32px;letter-spacing:-1.2px;margin:14px 0 8px}.auth-card p{line-height:1.7;color:#535f4c}.auth-card label{display:block;margin:16px 0 6px;font-weight:600;font-size:13px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #a1ad95;border-radius:8px;font-size:15px}.auth-card button{width:100%;margin:18px 0 10px;padding:13px;background:#26351e;color:#d2e985;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}.auth-error{background:#f9e7e1;padding:10px;color:#8b3524;border-radius:6px;font-size:13px}.auth-note{font-size:12px;color:#8a9976}.eyebrow{font-size:10px;letter-spacing:2px;color:#8c9c77;margin-top:18px}</style></head><body class="auth-page"><main class="auth-card"><a href="/about" class="auth-brand" aria-label="Reachmark home"><img src="/static/logo-primary.svg" alt="Reachmark" style="height:42px;width:auto;display:block;margin-bottom:6px"></a><p class="eyebrow">CLIENT PORTAL</p><h1>Welcome back.</h1><p>Sign in to view your projects, proposals and invoices.</p><div id="msg" role="alert" class="auth-error" style="display:none"></div><form id="login-form"><label for="email">Work email</label><input id="email" name="email" type="email" required maxlength="250" placeholder="you@company.com" autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="1024" autocomplete="current-password"><button type="submit">Sign in →</button></form><p class="auth-note">No account? <a href="/signup">Create one</a> · Studio owner? <a href="/login">Owner login</a></p><p class="auth-note">Your portal shows only what your studio assigned to your email. No global discovery access.</p></main><script>
let csrfToken='';
(async()=>{try{let r=await fetch('/login');let t=await r.text();let m=t.match(/name=\"csrf_token\" value=\"([^\"]+)\"/);csrfToken=m?m[1]:''}catch(e){}})();
const form=document.getElementById('login-form'),msg=document.getElementById('msg');
form.onsubmit=async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('password').value;
  msg.style.display='none';
  const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';
  try{
    if(!csrfToken){let r=await fetch('/login');let t=await r.text();let m=t.match(/name=\"csrf_token\" value=\"([^\"]+)\"/);csrfToken=m?m[1]:''}
    let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({email,password:pw})});
    let j=await r.json();
    if(!r.ok) throw new Error(j.error||'Unable to sign in.');
    location.href='/';
  }catch(err){msg.textContent=err.message;msg.style.display='block';btn.disabled=false;btn.textContent='Sign in →';}
};
</script></body></html>
