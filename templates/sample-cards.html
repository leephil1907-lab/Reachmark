<div class="sample-gallery">{% for sample in samples %}<article class="sample-card"><a class="sample-image" href="/showcase/{{ sample.slug }}" aria-label="Open {{ sample.name }} website sample"><img src="/static/samples/{{ sample.slug }}-preview.jpg" loading="lazy" alt="Preview of the fictional {{ sample.name }} website design"><span>Explore live preview ↗</span></a><div class="sample-card-copy"><div class="sample-kicker">{{ sample.category }} <span>FICTIONAL SAMPLE</span></div><h3>{{ sample.name }}</h3><p>{{ sample.description }}</p><div class="sample-card-actions"><a href="/showcase/{{ sample.slug }}">View website ↗</a><a href="/enquire?sample={{ sample.slug }}">Ask for an estimate</a></div></div></article>{% endfor %}</div>
