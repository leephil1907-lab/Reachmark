<div class="sample-gallery premium-stagger">{% for sample in samples %}<article class="sample-card premium-reveal"><a class="sample-image" href="/showcase/{{ sample.slug }}" aria-label="{{ t('show.card_open', name=sample.name) }}"><img src="/static/samples/{{ sample.slug }}-preview.jpg" loading="lazy" alt="{{ t('show.card_alt', name=sample.name, figma=sample.figma) }}"><span>{{ t('show.explore') }}</span>{% if sample.figma %}<span style="position:absolute; top:12px; right:12px; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border:1px solid #e2e7d6; padding:6px 8px; border-radius:20px; font-size:7px; letter-spacing:.5px; color:#6b7a5a; display:flex; align-items:center; gap:6px;"><span style="width:7px; height:7px; border-radius:50%; background:#d5f268; border:1px solid #cbe85b;"></span>{{ sample.figma }}</span>{% endif %}</a><div class="sample-card-copy"><div class="sample-kicker">{{ sample.category }} <span>{{ sample.style }}</span></div><h3>{{ sample.name }}</h3><p>{{ sample.description }}</p><div class="sample-card-actions"><a href="/showcase/{{ sample.slug }}">{{ t('show.card_view') }}</a><a href="/enquire?sample={{ sample.slug }}">{{ t('show.ask') }}</a></div></div></article>{% endfor %}</div>
