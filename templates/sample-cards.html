<div class="sample-gallery premium-stagger">{% for sample in samples %}<article class="sample-card premium-reveal"><a class="sample-image" href="/showcase/{{ sample.slug }}" aria-label="{{ t('show.card_open', name=sample.name) }}"><img src="/static/samples/{{ sample.slug }}-preview.jpg" loading="lazy" alt="{{ t('show.card_alt', name=sample.name, figma=sample.figma) }}">{% if sample.figma %}<span class="sample-figma"><span></span>{{ sample.figma }}</span>{% endif %}</a><div class="sample-card-copy"><div class="sample-kicker">{{ sample.category }} <span>{{ sample.style }}</span></div><h3>{{ sample.name }}</h3><p>{{ sample.description }}</p><div class="sample-card-actions"><a href="/showcase/{{ sample.slug }}">{{ t('show.card_view') }}</a><a href="/enquire?sample={{ sample.slug }}">{{ t('show.ask') }}</a></div></div></article>{% endfor %}</div>
