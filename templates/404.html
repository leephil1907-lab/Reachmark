<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow"><meta name="theme-color" content="#eef4fc">
  <title>404 — Found the leak · Reachmark</title>
  <link rel="stylesheet" href="/static/fonts.css"><link rel="stylesheet" href="/static/header.css"><link rel="stylesheet" href="/static/liquid-glass.css">
  {% include '_theme_head.html' %}
  <style>
    .lg-404{min-height:76vh;display:grid;place-items:center;padding:110px 20px 70px}
    .lg-404-panel{position:relative;overflow:hidden;width:min(760px,100%);padding:clamp(28px,6vw,64px);text-align:center;border:1px solid rgba(255,255,255,.9);border-radius:34px;background:rgba(255,255,255,.58);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 28px 90px rgba(25,48,84,.14)}
    .lg-404-number{position:relative;display:inline-block;font:400 clamp(110px,25vw,220px)/.8 'Instrument Serif',Georgia,serif;letter-spacing:-.08em;color:#1d4ed8}
    .lg-404-lens{position:absolute;inset:8% 10%;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(96,165,250,.14));box-shadow:inset 0 1px rgba(255,255,255,.9),0 16px 40px rgba(37,99,235,.13);animation:lg404float 7s ease-in-out infinite;pointer-events:none}
    .lg-404-panel h1{font:400 clamp(30px,5vw,48px)/1.05 'Instrument Serif',Georgia,serif;color:#17243a;margin:26px 0 10px}
    .lg-404-panel p{color:#64748b;line-height:1.7}
    .lg-404-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px 0}
    .lg-404-search{display:flex;max-width:460px;margin:24px auto 0;padding:6px;border:1px solid rgba(100,124,163,.2);border-radius:999px;background:rgba(255,255,255,.8)}
    .lg-404-search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 14px;outline:0;color:#17243a}
    .lg-404-search button{border:0;border-radius:999px;background:#1f5fe5;color:white;padding:10px 17px;font-weight:650}
    @keyframes lg404float{0%,100%{transform:translate3d(-3px,-6px,0) rotate(-5deg)}50%{transform:translate3d(5px,8px,0) rotate(6deg)}}
    @media(prefers-reduced-motion:reduce){.lg-404-lens{animation:none}}
    html[data-theme=dark] .lg-404-panel{background:rgba(20,34,56,.82);border-color:rgba(255,255,255,.12)}
    html[data-theme=dark] .lg-404-panel h1{color:#e5edf9}
    html[data-theme=dark] .lg-404-search{background:rgba(10,20,36,.9);border-color:rgba(255,255,255,.16)}
    html[data-theme=dark] .lg-404-search input{color:#e5edf9}
  </style>
</head>
<body class="x-site">
  {% include 'header-public.html' %}
  <main class="lg-404">
    <section class="lg-404-panel" aria-labelledby="lg-404-title">
      <div class="lg-404-number" aria-hidden="true">404<span class="lg-404-lens"></span></div>
      <h1 id="lg-404-title">Found the leak. This page isn't here.</h1>
      <p>The address may have moved, or the link may be broken. Let's get you back to something useful.</p>
      <div class="lg-404-actions"><a class="x-btn lime" href="/">Back home</a><a class="x-btn ghost" href="/#work">See our work</a></div>
      <form class="lg-404-search" action="/showcase" method="get" role="search"><label class="sr-only" for="lg-404-q">Search Reachmark work</label><input id="lg-404-q" type="search" name="q" placeholder="Search our work…" aria-label="Search our work"><button type="submit">Search</button></form>
    </section>
  </main>
  {% include 'footer-public.html' %}
  <script src="/static/theme.js"></script><script src="/static/liquid-glass.js" defer></script>
</body>
</html>
