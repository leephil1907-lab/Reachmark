<!doctype html>
<html lang="{{ locale }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find businesses in your city · Reachmark</title>
<meta name="robots" content="noindex">
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="/static/fonts.css"><link rel="stylesheet" href="/static/xdesign.css">
<style>
body{margin:0;font-family:Manrope,Arial,sans-serif;background:#fbfbfb;color:#111314;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:520px;background:#fff;border:1px solid #e2e7d6;border-radius:20px;padding:32px;box-shadow:0 18px 48px rgba(16,24,12,.08)}
.kicker{font:600 10px/1 Manrope,sans-serif;letter-spacing:1.6px;color:#6b7a5a;text-transform:uppercase}
h1{font:700 28px/1.1 Manrope,sans-serif;letter-spacing:-.8px;margin:10px 0 8px;color:#0f1a0a}
p{color:#535f4c;font-size:14px;line-height:1.6}
label{display:block;font:600 12px Manrope,sans-serif;margin:16px 0 6px;color:#20251f}
input,select{width:100%;padding:12px 14px;border:1px solid #d8e0c8;border-radius:10px;font:15px Manrope,sans-serif;background:#fcfcf8}
button{margin-top:22px;width:100%;border:0;background:#d5f268;color:#20251f;font:700 14px Manrope,sans-serif;padding:14px;border-radius:12px;cursor:pointer}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px}
.skip{display:block;text-align:center;margin-top:14px;color:#6b7a5a;font-size:13px}
</style>
</head>
<body>
<form class="card" id="onboard-form">
  <div class="kicker">After signup</div>
  <h1>Where should we look first?</h1>
  <p>Pick a city and a niche. We pull up to 10 public listings from OpenStreetMap and score them from stored evidence — no invented numbers, no live crawl of every site.</p>
  <label for="city">City</label>
  <input id="city" name="city" required maxlength="80" placeholder="e.g. Lagos" autocomplete="address-level2">
  <label for="category">Niche</label>
  <select id="category" name="category" required>
    <option value="">Choose a niche</option>
    {% for name in categories %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
  </select>
  <button type="submit" id="go">Find 10 businesses</button>
  <div class="msg" id="msg"></div>
  <a class="skip" href="/dashboard">Skip for now</a>
</form>
<script>
const csrf=document.querySelector('meta[name="csrf-token"]').content;
const msg=document.getElementById('msg');
document.getElementById('onboard-form').onsubmit=async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('go');
  btn.disabled=true; btn.textContent='Searching OpenStreetMap…';
  msg.style.display='none';
  try{
    const r=await fetch('/api/onboard',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({city:document.getElementById('city').value.trim(),category:document.getElementById('category').value})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Could not search.');
    if(j.empty){
      msg.textContent='No listings matched that city and niche in OpenStreetMap this time. You can try another city, or add a business by hand.';
      msg.style.display='block'; msg.style.background='#eef6d1';
      btn.disabled=false; btn.textContent='Try again';
      return;
    }
    location.href=j.next||'/dashboard#leads';
  }catch(err){
    msg.textContent=err.message; msg.style.display='block';
    btn.disabled=false; btn.textContent='Find 10 businesses';
  }
};
</script>
</body></html>
