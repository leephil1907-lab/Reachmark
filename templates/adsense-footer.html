{# Optional display-ad unit. Render only after a real slot ID is configured. #}
{% if adsense_client and adsense_display_slot %}
<div class="adsense-footer" role="complementary" aria-label="Advertisement" style="margin:28px auto;max-width:1060px;padding:18px 16px 14px;background:#fff;border:1px solid #e2e7d6;border-radius:16px;text-align:center">
  <div style="font:700 9px Manrope,Arial,sans-serif;letter-spacing:2px;color:#8a9976;margin-bottom:10px">ADVERTISEMENT</div>
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ adsense_client }}" data-ad-slot="{{ adsense_display_slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
