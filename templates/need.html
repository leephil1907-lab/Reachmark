<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t('need.title') }}</title>
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#fbfbfb">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/header.css">
<link rel="stylesheet" href="/static/xdesign.css">
<link rel="stylesheet" href="/static/opportunity.css">
<script src="/static/i18n.js"></script>
</head>
<body class="x-site">
{% include 'header-public.html' %}
<main class="oe-sheet" style="padding-top:48px">
  <p class="oe-kicker">{{ t('need.kicker') }}</p>
  <h1>{{ t('need.h1') }}</h1>
  <p class="oe-lede">{{ t('need.lede') }}</p>
  <form id="need-form" class="card" style="padding:24px;margin-top:28px;display:grid;gap:14px;max-width:640px">
    <label>{{ t('need.name') }}<input name="name" required maxlength="120"></label>
    <label>{{ t('need.email') }}<input name="email" type="email" maxlength="200"></label>
    <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <label>{{ t('need.city') }}<input name="city" maxlength="120"></label>
      <label>{{ t('need.cat') }}<input name="category" maxlength="80" placeholder="{{ t('need.cat_ph') }}"></label>
    </div>
    <label>{{ t('need.what') }}
      <textarea name="need" required minlength="20" maxlength="2000" rows="6" placeholder="{{ t('need.what_ph') }}"></textarea>
    </label>
    <button class="x-btn dark" type="submit">{{ t('need.submit') }}</button>
    <p class="oe-note" id="need-msg"></p>
  </form>
</main>
{% include 'footer-public.html' %}
<script>
document.getElementById('need-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  const msg = document.getElementById('need-msg');
  const T_ = window.T || function(k,f){return f;};
  msg.textContent = T_('need.saving', {{ t('need.saving')|tojson }});
  try {
    const r = await fetch('/api/need', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || T_('need.err', {{ t('need.err')|tojson }}));
    location.href = j.url;
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
