<!DOCTYPE html><html lang="{{ locale }}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach preferences — Reachmark</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#20251f"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#445535;font:14px/1.8 'DM Sans',sans-serif;display:grid;place-items:center;min-height:100vh}main{width:440px;max-width:calc(100% - 36px);background:#fcfcf8;border:1px solid #e0e6d3;border-radius:13px;padding:38px;box-shadow:0 8px 35px #32472306}.logo{width:165px;margin-bottom:38px}h1{font:600 28px/1.25 'Manrope',sans-serif;letter-spacing:-1px;margin:0 0 17px;color:#4f6540}p{font-size:12px;color:#9cab8a;margin-bottom:26px}button{border:1px solid #c8e45e;border-radius:6px;background:#d5f268;color:#41532a;font:600 11px 'DM Sans',sans-serif;padding:14px 20px;cursor:pointer;transition:background .2s}button:hover{background:#c7e858}small{display:block;font-size:9px;color:#b0bba1;border-top:1px solid #e7edda;padding-top:22px;margin-top:30px}</style></head><body><main><img class="logo" src="/static/logo-primary.svg" alt="Reachmark">{% if done %}<h1>{{ t('un.done_a') }}<br>{{ t('un.done_b') }}</h1><p>{{ t('un.done_p') }}</p>{% else %}<h1>{{ t('un.h') }}</h1><p>{{ t('un.p') }}</p><form method="POST"><button>{{ t('un.btn') }}</button></form>{% endif %}<small>{{ t('un.small') }}</small></main></body></html>
