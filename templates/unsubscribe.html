<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach preferences</title><style>body{margin:0;background:#f8f7fc;font:16px/1.7 system-ui;color:#443b55;display:grid;place-items:center;min-height:100vh}main{max-width:430px;background:white;border:1px solid #e9e4f3;padding:35px;border-radius:14px;margin:20px}h1{font-size:25px}p{font-size:14px;color:#8d809e}button{border:0;border-radius:7px;background:#7660d9;color:white;padding:14px 22px;cursor:pointer}</style></head><body><main>{% if done %}<h1>You’re opted out.</h1><p>Outreach to this saved email address is now blocked in this workspace. No further action is needed.</p>{% else %}<h1>Keep your inbox yours.</h1><p>Confirm below to stop outreach to the email address associated with this invitation.</p><form method="POST"><button>Unsubscribe from outreach</button></form>{% endif %}</main></body></html>
