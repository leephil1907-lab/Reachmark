name: Reachmark frontend and backend checks
on:
  push:
    branches: [feat/liquid-glass-render-migration, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build legacy assets and React site
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Flask syntax
        run: python -m compileall -q web
