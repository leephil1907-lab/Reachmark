name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
      - run: python -m unittest test_app test_operations test_maps.MapTests test_production -q
      - run: node --check static/app.js && node --check static/production.js && node --check static/world-map.js
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python tests/browser/production_flow.py && PYTHONPATH=. python tests/browser/map_flow.py
      - run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -t reachmark:ci .
