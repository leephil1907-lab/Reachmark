name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
      - run: python -m unittest tests.test_app tests.test_operations tests.test_maps.MapTests tests.test_production tests.test_crew tests.test_video tests.test_receptionist_page tests.test_brain -q
      - run: for f in static/*.js; do node --check "$f"; done
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python tests/browser/production_flow.py && PYTHONPATH=. python tests/browser/map_flow.py
      - run: python scripts/crew_smoke.py
      - run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -t reachmark:ci .
